name: Exercise Processing

on:
  push:
    branches: [main]
    paths:
      - 'data/exercise/activities.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: exercise-process
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Contract tests
        run: >-
          python -m unittest
          tests.test_exercise_contract
          tests.test_exercise_sync_contract
          tests.test_activity_store
          tests.test_monthly_coach

      - name: Process activities
        env:
          # 公开地理编码服务要求可识别的应用与联系标识。
          NOMINATIM_USER_AGENT: "white1213-blog/1.0 (https://white1213.github.io/blog/)"
          NOMINATIM_REFERER: "https://white1213.github.io/blog/"
        run: python process_activities.py

      # GITHUB_TOKEN 的 push 不触发其他工作流，因此提交产物后主动点燃 deploy。
      - name: Commit and trigger deploy
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "white1213-bot"
          git config user.email "1665491507a@gmail.com"
          git add assets/data/exercise/activities.json assets/data/exercise/monthly-insights.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No processed-artifact changes."
            exit 0
          fi
          input_blob="$(git rev-parse HEAD:data/exercise/activities.json)"
          git commit -m "chore: process exercise activities"
          for attempt in 1 2 3; do
            git fetch origin main
            remote_blob="$(git rev-parse origin/main:data/exercise/activities.json)"
            if [ "$remote_blob" != "$input_blob" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Superseded by newer raw facts; the newer run will handle them."
              exit 0
            fi
            if git rebase origin/main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              curl -sf -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/white1213/blog/actions/workflows/deploy.yml/dispatches \
                -d '{"ref":"main"}'
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
          done
          echo "::error::push failed after retries"
          exit 1
