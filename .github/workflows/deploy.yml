name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
    # 只有原始运动事实变化的提交跳过部署，等处理产物出来再构建。
    paths-ignore:
      - 'data/exercise/activities.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        run: hugo --minify --panicOnWarning

      # 直接发布到 gh-pages 分支，由 Pages 从分支构建。
      # 不依赖 Pages 的 deployment API（该接口曾出现 500 并导致部署队列卡死）。
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: white1213-bot
          user_email: 1665491507a@gmail.com
