name: Playlist Sync

on:
  schedule:
    # UTC 20:37 = 北京时间每天 04:37
    - cron: '37 20 * * *'
  workflow_dispatch:
    inputs:
      playlist_url:
        description: '要添加的歌单链接或 ID（留空则只刷新已有歌单）'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: playlist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync playlists
        env:
          INPUT_URL: ${{ inputs.playlist_url }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            python -I sync_playlists.py "$INPUT_URL"
          else
            python -I sync_playlists.py
          fi

      # GITHUB_TOKEN 的 push 不触发其他工作流，提交后主动点燃 deploy。
      - name: Commit and trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "white1213-bot"
          git config user.email "1665491507a@gmail.com"
          git add assets/data/playlists.json
          if [ -d static/playlist-covers ]; then
            git add static/playlist-covers
          fi
          if git diff --staged --quiet; then
            echo "No playlist changes."
            exit 0
          fi
          git commit -m "chore: sync playlists"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              curl -sf -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/white1213/blog/actions/workflows/deploy.yml/dispatches \
                -d '{"ref":"main"}'
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
          done
          echo "::error::push failed after retries"
          exit 1
