name: Playlist Sync

on:
  schedule:
    # UTC 20:37 = 北京时间每天 04:37
    - cron: '37 20 * * *'
  workflow_dispatch:
    inputs:
      playlist_url:
        description: '要添加的歌单链接或 ID（留空则只刷新已有歌单）'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: playlist-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync playlists
        env:
          INPUT_URL: ${{ inputs.playlist_url }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            python -I sync_playlists.py "$INPUT_URL"
          else
            python -I sync_playlists.py
          fi

      # 同步成功后直接构建并发布到 gh-pages（复合 action），不依赖额外的 Deploy job。
      - name: Commit changes
        id: commit
        run: |
          git config user.name "white1213-bot"
          git config user.email "1665491507a@gmail.com"
          git add assets/data/playlists.json assets/data/sync-status.json
          if [ -d static/playlist-covers ]; then
            git add static/playlist-covers
          fi
          if git diff --staged --quiet; then
            echo "No playlist changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --staged --name-only | grep -qv 'assets/data/sync-status.json'; then
            git commit -m "chore: sync playlists"
          else
            git commit -m "chore: playlist check-in (no data changes)"
          fi
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
          done
          echo "::error::push failed after retries"
          exit 1

      - name: Build and deploy
        if: steps.commit.outputs.changed == 'true'
        uses: ./.github/actions/build-deploy
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
