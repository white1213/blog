name: Steam Sync

on:
  schedule:
    # UTC 21:10 = 北京时间每天 05:10
    - cron: '10 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: steam-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Write credentials
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ vars.STEAM_ID }}
        run: |
          if [ -z "$STEAM_API_KEY" ] || [ -z "$STEAM_ID" ]; then
            echo "::error::缺少 STEAM_API_KEY(secret) 或 STEAM_ID(variable)"
            exit 1
          fi
          printf 'STEAM_API_KEY=%s\nSTEAM_ID=%s\n' "$STEAM_API_KEY" "$STEAM_ID" > /tmp/steam.env
          chmod 600 /tmp/steam.env

      - name: Sync library
        run: python sync_steam.py /tmp/steam.env

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/steam.env

      # 同步成功后直接构建并发布到 gh-pages（复合 action），不依赖额外的 Deploy job。
      - name: Commit changes
        id: commit
        run: |
          git add assets/data/steam.json assets/data/sync-status.json static/steam-covers
          if git diff --staged --quiet; then
            echo "No steam changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "white1213-bot"
          git config user.email "1665491507a@gmail.com"
          if git diff --staged --name-only | grep -qv 'assets/data/sync-status.json'; then
            git commit -m "chore: sync steam library"
          else
            git commit -m "chore: steam check-in (no data changes)"
          fi
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
          done
          echo "::error::push failed after retries"
          exit 1

      - name: Build and deploy
        if: steps.commit.outputs.changed == 'true'
        uses: ./.github/actions/build-deploy
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
