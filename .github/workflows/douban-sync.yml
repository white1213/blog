name: Douban Movie Sync

on:
  schedule:
    # UTC 20:23 = 北京时间每天 04:23
    - cron: '23 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: douban-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard douban id
        env:
          DOUBAN_ID: ${{ vars.DOUBAN_ID }}
        run: |
          if [ -z "$DOUBAN_ID" ]; then
            echo "::error::repo variable DOUBAN_ID is not set"
            exit 1
          fi

      - name: Fetch movie data
        id: fetch
        env:
          DOUBAN_ID: ${{ vars.DOUBAN_ID }}
        run: python sync_movies.py

      # GITHUB_TOKEN 的 push 不触发其他工作流，因此提交后主动点燃 deploy。
      - name: Commit and trigger deploy
        if: env.HAS_NEW_DATA == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "white1213-bot"
          git config user.email "1665491507a@gmail.com"
          git add assets/data/movies.json
          git commit -m "chore: sync douban movies"
          git push origin HEAD:main
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/white1213/blog/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
