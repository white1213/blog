name: Douban Movie Sync

on:
  schedule:
    # UTC 20:23 = 北京时间每天 04:23
    - cron: '23 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: douban-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard douban id
        env:
          DOUBAN_ID: ${{ vars.DOUBAN_ID }}
        run: |
          if [ -z "$DOUBAN_ID" ]; then
            echo "::error::repo variable DOUBAN_ID is not set"
            exit 1
          fi

      - name: Fetch movie data
        id: fetch
        env:
          DOUBAN_ID: ${{ vars.DOUBAN_ID }}
        run: python sync_movies.py

      # 同步成功后直接构建并发布到 gh-pages（复合 action）。
      # 不再 dispatch deploy.yml：那个独立 job 多次长时间排队拿不到 runner，
      # 会造成"数据已提交但网站不更新"。
      # 心跳设计：sync-status.json 每次必更新，无数据变化的日子也有提交+部署，
      # 首页的逐项同步状态由此点亮。
      - name: Commit changes
        id: commit
        run: |
          git config user.name "white1213-bot"
          git config user.email "1665491507a@gmail.com"
          git add assets/data/movies.json assets/data/sync-status.json
          if [ -d static/movies-covers ]; then
            git add static/movies-covers
          fi
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --staged --name-only | grep -qv 'assets/data/sync-status.json'; then
            git commit -m "chore: sync douban movies"
          else
            git commit -m "chore: douban check-in (no data changes)"
          fi
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
          done
          echo "::error::push failed after retries"
          exit 1

      - name: Build and deploy
        if: steps.commit.outputs.changed == 'true'
        uses: ./.github/actions/build-deploy
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
