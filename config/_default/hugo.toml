baseURL = "https://white1213.github.io/blog/"
locale = "zh-CN"
timeZone = "Asia/Shanghai"
title = "我的站点"
theme = "jingzhe_v3"

enableRobotsTXT = true
hasCJKLanguage = true

# Hugo 0.167 起 cleanDestinationDir 顶层键废弃，改为 build.cleanDestinationDir.enable
[build]
  [build.cleanDestinationDir]
    enable = true

[module]
  [module.hugoVersion]
    min = "0.158.0"

[permalinks]
  posts = "/:slug/"

[markup]
  [markup.highlight]
    guessSyntax = true
    lineNos = false
    noClasses = false

  [markup.goldmark.renderer]
    unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"
  laodaotag = "laodaotags"

[related]
  includeNewer = true
  threshold = 80
  toLower = true

  [[related.indices]]
    name = "laodaotags"
    weight = 100

  [[related.indices]]
    name = "date"
    pattern = "200601"
    weight = 10

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "posts"
    name = "随笔"
    url = "/posts/"
    weight = 2
